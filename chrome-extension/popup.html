<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkmatter Security Scan</title>
  <style>
    :root {
      --primary: #00ff00;
      --bg: #0a0a0a;
      --card-bg: #151515;
      --text: #ffffff;
      --text-muted: #888888;
      --danger: #ff4444;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }

    .header h1 {
      font-size: 1.2rem;
      margin: 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: block;
    }

    .url-display {
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      background: #000;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #222;
      word-break: break-all;
      color: var(--primary);
    }

    .profile-select {
      width: 100%;
      background: #000;
      color: var(--text);
      border: 1px solid #333;
      padding: 8px;
      border-radius: 4px;
      margin-top: 4px;
      outline: none;
    }

    .profile-select:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background: var(--primary);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:disabled {
      background: #333;
      color: #666;
      cursor: not-allowed;
    }

    .footer {
      font-size: 0.7rem;
      text-align: center;
      color: var(--text-muted);
      margin-top: 10px;
    }

    #status {
      margin-top: 12px;
      font-size: 0.8rem;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    .status-success {
      display: block !important;
      background: rgba(0, 255, 0, 0.1);
      border: 1px solid var(--primary);
      color: var(--primary);
    }

    .status-error {
      display: block !important;
      background: rgba(255, 68, 68, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
    }

    .loader {
      width: 16px;
      height: 16px;
      border: 2px solid #000;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .scanning .loader {
      display: inline-block;
    }

    .scanning .btn-text {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    </svg>
    <h1>Darkmatter</h1>
  </div>

  <div class="card">
    <span class="label">TARGET URL</span>
    <div id="url" class="url-display">Fetching...</div>
  </div>

  <div class="card">
    <span class="label">SCAN PROFILE</span>
    <select id="profile" class="profile-select">
      <option value="full">Full Assessment (Deep)</option>
      <option value="quick">Quick Scan (Fast)</option>
      <option value="stealth">Stealth Discovery (Quiet)</option>
    </select>
  </div>

  <button id="scanBtn">
    <div class="loader"></div>
    <span class="btn-text">INITIALIZE SCAN</span>
  </button>

  <div id="status"></div>

  <!-- Results Section -->
  <div id="results" style="display: none; margin-top: 16px; border-top: 1px solid #333; padding-top: 16px;">
    <div class="header" style="margin-bottom: 12px; border-bottom: none;">
      <h2 style="font-size: 0.9rem; margin: 0; color: var(--primary);">SCAN RESULTS</h2>
    </div>
    <div id="findings-list" style="max-height: 200px; overflow-y: auto;">
      <!-- Findings will be injected here -->
      <div style="color: var(--text-muted); font-size: 0.8rem; text-align: center; padding: 10px;">
        Listening for security findings...
      </div>
    </div>
  </div>

  <div class="footer">
    Powered by Darkmatter Security Engine v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
